<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Farm Simulator 🌾</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Шапка: монеты, вода, состояние игры -->
    <header id="header">
        <div class="stat" id="coinsStat">
            <img src="assets/images/objects/coin.png" alt="Монеты" class="stat-icon coin-icon">
            <span class="stat-value" id="coinsValue">0</span>
        </div>
        <div class="stat" id="waterStat">
            <span class="stat-icon">💧</span>
            <span class="stat-value" id="waterValue">0</span>
        </div>
    </header>

    <!-- Контейнер экранов -->
    <main id="screens">
        <section id="screen-well" class="screen active"></section>
        <section id="screen-farm" class="screen"></section>
        <section id="screen-market" class="screen"></section>
    </main>

    <!-- Навигация по экранам -->
    <nav id="nav">
        <button class="nav-btn active" data-screen="well">
            <span class="nav-icon">🪣</span>
            <span class="nav-label">Колодец</span>
        </button>
        <button class="nav-btn" data-screen="farm">
            <span class="nav-icon">🌱</span>
            <span class="nav-label">Ферма</span>
        </button>
        <button class="nav-btn" data-screen="market">
            <span class="nav-icon">🏪</span>
            <span class="nav-label">Рынок</span>
        </button>
    </nav>

    <!-- Контейнер для всплывающих чисел -->
    <div id="floatingTextLayer"></div>

    <!-- Контейнер для частиц (брызги, монеты, плоды) -->
    <div id="particleLayer"></div>

    <!-- Контейнер для модалок и тостов -->
    <div id="modalRoot"></div>
    <div id="toastRoot"></div>

    <script src="js/economy.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/svg/basket.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/gameState.js"></script>
    <script src="js/screens/well.js"></script>
    <script src="js/screens/farm.js"></script>
    <script src="js/screens/farmHarvest.js"></script>
    <script src="js/screens/market.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
